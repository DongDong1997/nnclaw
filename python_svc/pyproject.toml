[project]
name = "nnclaw-ml-service"
version = "0.1.0"
description = "ML algorithm execution service for NNClaw"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
]

[tool.poetry]
name = "nnclaw-ml-service"
version = "0.1.0"
description = "ML algorithm execution service for NNClaw"
authors = ["NNClaw Team"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
scikit-learn = "^1.4.0"
numpy = "^1.26.0"
matplotlib = "^3.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
